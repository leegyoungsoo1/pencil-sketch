<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>연필 초상화 영상 제작기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="intro">
      <p class="eyebrow">PHOTO → DRAWING VIDEO</p>
      <h1>연필 초상화 영상 제작기</h1>
      <p>사진을 넣으면 빈 종이에 연필이 한 획씩 크로키를 그려 나가는 영상을 만듭니다.</p>
    </section>
    <section class="controls" aria-label="영상 설정">
      <label class="upload" for="photo"><span>사진 선택</span><small id="fileName">JPG · PNG · WEBP</small></label>
      <input id="photo" type="file" accept="image/*" />
      <label>영상 길이 <output id="secondsLabel">20초</output><input id="seconds" type="range" min="4" max="20" value="20" /></label>
      <label>그림 스타일
        <select id="style">
          <option value="line" selected>선만 (크로키)</option>
          <option value="shade">선 + 그림자 살짝</option>
        </select>
      </label>
      <label>선 진하기 <output id="darknessLabel">130%</output><input id="darkness" type="range" min="50" max="200" value="130" /></label>
      <label>그림자 양 <output id="strengthLabel">50%</output><input id="strength" type="range" min="0" max="100" value="50" disabled /></label>
      <label class="check"><input id="signature" type="checkbox" checked /> 마지막에 서명 넣기 (David Lee.)</label>
      <label class="check"><input id="sound" type="checkbox" checked /> 연필 사각거리는 소리 넣기</label>
      <label>연필 소리 크기 <output id="volumeLabel">30%</output><input id="volume" type="range" min="0" max="100" value="30" /></label>
      <label>저장 형식
        <select id="format">
          <option value="mp4" selected>MP4 (대부분의 플레이어·편집 프로그램)</option>
          <option value="webm">WebM</option>
        </select>
      </label>
      <div class="actions"><button id="preview" type="button">미리보기</button><button id="export" type="button" class="primary">MP4 영상 저장</button></div>
      <p id="status" role="status">사진을 선택하면 흑연 연필 초상화로 변환합니다.</p>
    </section>
    <section class="stage">
      <canvas id="canvas" width="720" height="960" aria-label="연필 드로잉 미리보기"></canvas>
      <p class="hint">얼굴을 먼저 완성한 뒤 몸과 배경으로 이어지는 연필 크로키 영상입니다. 얼굴 위치가 틀리면 캔버스에서 얼굴을 클릭하거나 드래그하세요.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
